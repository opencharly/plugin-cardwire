version: 2026.240.1943
plugin-cardwire:
    candy:
        version: 2026.243.0001
        description: |-
            OUT-OF-TREE charly COMMAND-class plugin for the cardwire GPU-manager surface
            (ogc/cardwire — the Open Gaming Collective's eBPF/LSM GPU-blocking daemon,
            CachyOS/Arch first): command:cardwire (status | list | config | gpu <id>
            block|unblock | manager). `status` is a deterministic, GPU-less-graceful host
            report: the cardwired systemd state, the /etc/cardwire/cardwire.toml
            whitelisted keys (auto_apply_gpu_state / experimental_nvidia_block /
            battery_auto_switch / battery_auto_switch_mode /
            external_display_auto_switch) and the BPF-LSM facts read DIRECTLY from
            /sys/kernel/security/lsm (the same canonical reads plugin-bpf's status
            performs — R3: one canonical surface, no ad-hoc copies, no shelling out to
            charly bpf; the plugin is self-contained). `list` parses the REAL cardwire
            list --json shape (the two-GPU fixture captured in the Phase-0 spike:
            Virtio 1.0 GPU id 0 + NVIDIA GeForce RTX 4080 SUPER id 1) into stable
            keys, N/A-graceful when cardwire is absent (exit 0 — the host-independent
            check-cardwire-local bed assertion), exit 1 only on a REAL failure of an
            installed cardwire. `config get|set <key> [value]` reads/writes the toml
            atomically (tmp+rename, mirroring cardwire's own approach). `gpu <id>
            block|unblock` is the MUTATING enable/disable surface: it forks
            /usr/bin/cardwire, then VERIFIES the blocked flag actually flipped via
            cardwire list --json (the daemon enforces mode-dependent semantics;
            verification is the honest contract) — cardwire UNAVAILABLE → exit 1 (a
            mutating surface refuses, never pretends). `manager status` passes through.

            The INSTALL PLAN is the CachyOS-first deploy scope (distro arch/cachyos):
            append the [ogc] pacman repo, trust the OGC signing key
            (F79100EF8C802DAB81C323BB8EEA5962FE510E19), pacman -Syu ogc/cardwire, write
            the /etc/cardwire/cardwire.toml defaults (experimental_nvidia_block=true),
            enable+start cardwired, and add the primary user to the video,render groups
            — verified by plan checks (binary / service / toml / bpf-lsm gate). The
            canonical check-cardwire-local witness bed (kind:local, host-independent
            graceful-N/A assertions) lives in opencharly/charly (goal task 4) — the
            full R10 run of this change's disposable copy is pasted in the PR body.
        plugin:
            source: github.com/opencharly/plugin-cardwire/candy/plugin-cardwire
            providers:
                - command:cardwire
        plan:
            - run: append the [ogc] pacman repo to /etc/pacman.conf (idempotent)
              run_as: root
              command: |
                if ! grep -q '^\[ogc\]' /etc/pacman.conf 2>/dev/null; then
                  printf '\n[ogc]\nServer = https://pacman.opengamingcollective.org\n' >> /etc/pacman.conf
                fi
            - run: trust the OGC signing key F79100EF8C802DAB81C323BB8EEA5962FE510E19
              run_as: root
              command: |
                pacman-key --recv-keys F79100EF8C802DAB81C323BB8EEA5962FE510E19 || true
                pacman-key --lsign-key F79100EF8C802DAB81C323BB8EEA5962FE510E19 || true
            - run: install cardwire from the ogc repo
              run_as: root
              command: pacman -Syu --needed --noconfirm ogc/cardwire
            - run: write the /etc/cardwire/cardwire.toml defaults
              write: /etc/cardwire/cardwire.toml
              run_as: root
              mode: "0644"
              content: |
                auto_apply_gpu_state = true
                experimental_nvidia_block = true
                battery_auto_switch = false
                battery_auto_switch_mode = "hybrid"
                external_display_auto_switch = false
            - run: enable + start the cardwired daemon
              run_as: root
              command: |
                systemctl daemon-reload || true
                systemctl enable --now cardwired
            - run: add the primary user to the video,render groups (GPU access)
              run_as: root
              command: |
                u="$(getent passwd 1000 | cut -d: -f1)"
                [ -n "$u" ] && usermod -aG video,render "$u" || true
            - check: the cardwire binary is installed at /usr/bin/cardwire
              id: cardwire-binary-present
              file:
                file: /usr/bin/cardwire
                exists: true
            - check: the cardwired daemon is active
              id: cardwired-active
              exit_status: 0
              stdout:
                - contains: active
              command: systemctl is-active cardwired
            - check: the config file carries the experimental_nvidia_block=true default
              id: cardwire-config-defaults
              file:
                file: /etc/cardwire/cardwire.toml
                contains: "experimental_nvidia_block = true"
            - check: the kernel enables the bpf LSM (the BPF-LSM gate cardwire's eBPF blocker needs)
              id: bpf-lsm-gate
              exit_status: 0
              stdout:
                - contains: bpf
              command: cat /sys/kernel/security/lsm
            - # ADE build-context check: a deterministic check that does NOT depend on the
              # project context the `charly cardwire` CLI needs (the prescan finds this candy
              # from the project dir). Mirrors plugin-bpf/plugin-udev — a trivial
              # build-context `plugin: command` (the built-in command CHECK verb) running
              # `true`, proving the host can build + fork/exec the module. The full CLI
              # end-to-end (`charly cardwire status` / list / config graceful-N/A contracts)
              # is exercised by the Go tests + the live R10 (check-cardwire-local).
              check: the cardwire plugin ships a buildable Go module the host can build + fork/exec; the deterministic end-to-end (status / list / config exit-code contracts) is exercised by the check-cardwire-local bed in opencharly/charly
              id: cardwire-module-present
              context:
                - build
              command: "true"
